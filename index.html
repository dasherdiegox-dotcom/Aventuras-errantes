<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102b3c">
  <meta name="description" content="Explora las islas errantes con Niko en una aventura de plataformas original.">
  <title>Niko y las Islas Errantes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <a class="wordmark" href="#" aria-label="Niko y las Islas Errantes"><span class="brand-mark">✦</span> ISLAS ERRANTES</a>
      <div class="topbar-right"><span class="edition">Una aventura entre las nubes</span><button id="sound-button" class="sound-button" type="button" aria-label="Activar sonido">♪ <span>Sonido: apagado</span></button></div>
    </header>
    <section class="game-frame" aria-label="Área de juego">
      <canvas id="game" width="960" height="540" tabindex="0" aria-label="Juego de plataformas de Niko. Usa flechas o A y D para moverte, espacio para saltar y Escape para pausar."></canvas>
      <div id="touch-controls" class="touch-controls" aria-label="Controles táctiles">
        <div class="touch-move"><button data-control="left" aria-label="Mover a la izquierda">◀</button><button data-control="right" aria-label="Mover a la derecha">▶</button></div>
        <button class="jump-button" data-control="jump" aria-label="Saltar">SALTAR</button>
      </div>
    </section>
    <footer class="page-footer"><span>30 islas te esperan al otro lado del horizonte.</span><span>Mover <kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd> · Saltar <kbd>Espacio</kbd> · Pausa <kbd>Esc</kbd></span></footer>
  </main>
  <script src="src/game.js" defer></script>
</body>
</html>
